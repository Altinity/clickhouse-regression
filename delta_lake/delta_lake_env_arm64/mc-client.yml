services:
  mc:
    depends_on:
      - rustfs
    image: clickhouse/minio-mc:RELEASE.2025-04-16T18-13-26Z
    container_name: delta_lake_mc
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add rustfs http://rustfs:9000 ${RUSTFS_ACCESS_KEY:-admin} ${RUSTFS_SECRET_KEY:-password}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc rm -r --force rustfs/warehouse;
      /usr/bin/mc mb rustfs/warehouse --ignore-existing;
      /usr/bin/mc anonymous set public rustfs/warehouse;
      tail -f /dev/null
      "
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/mc ls rustfs/warehouse || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
