name: 🧪 CAS checks
run-name: 🧪 CAS checks | ${{ inputs.version }} | ${{ inputs.architecture }}

# One dispatch for every CAS check. Package and version are the only required
# inputs. Architecture defaults to x86.
#
# When the package URL contains /PRs/<number>/, the run title includes that
# number, for example "PR 2440". A job reads the path because the run title
# is fixed before an expression can read a path segment.
#
# Soak runs every soak suite. Jepsen runs all eight server nemeses.
# Alter stress runs every combinations scenario on MinIO with --cas
# (20 groups per scenario). Regression suite cas_all runs the CAS suite,
# the CAS suite with --cas-s3-cache, and every other suite that has a
# --cas or --cas-s3-cache variant.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "📦 Package. Either 'docker://' or 'https://'. Example: 'docker://altinity/clickhouse-server:26.6…' or a .deb URL"
        required: true
        type: string
      version:
        description: "🎯 Expected ClickHouse version"
        required: true
        type: string
      architecture:
        description: "🖥 Runner architecture (default: x86)"
        type: choice
        options:
          - x86
          - arm64
          - all
        default: x86

jobs:
  run_name:
    name: Set run name
    runs-on: ubuntu-latest
    permissions:
      actions: write
    continue-on-error: true
    steps:
      - name: Add the PR number from the package URL
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          ARCH: ${{ inputs.architecture }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr=$(printf '%s\n' "$PACKAGE" | sed -n 's|.*/PRs/\([0-9][0-9]*\)/.*|\1|p')
          if [ -z "$pr" ]; then
            echo "No /PRs/<number>/ segment in the package URL. Leaving the run name unchanged."
            exit 0
          fi
          name="🧪 CAS checks | PR ${pr} | ${VERSION} | ${ARCH}"
          echo "Run name: ${name}"
          jq -n --arg name "$name" '{name:$name}' | gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --input -

  soak:
    name: CAS soak
    uses: ./.github/workflows/run-cas-soak.yml
    with:
      package: ${{ inputs.package }}
      version: ${{ inputs.version }}
      suite: all
      architecture: ${{ inputs.architecture == 'arm64' && 'ARM' || inputs.architecture }}
    secrets: inherit

  jepsen_x86:
    name: CAS Jepsen x86
    if: ${{ inputs.architecture == 'x86' || inputs.architecture == 'all' }}
    uses: ./.github/workflows/run-cas-jepsen.yml
    with:
      package: ${{ inputs.package }}
      version: ${{ inputs.version }}
      arch: x86
    secrets: inherit

  jepsen_arm:
    name: CAS Jepsen arm64
    if: ${{ inputs.architecture == 'arm64' || inputs.architecture == 'all' }}
    uses: ./.github/workflows/run-cas-jepsen.yml
    with:
      package: ${{ inputs.package }}
      version: ${{ inputs.version }}
      arch: arm64
    secrets: inherit

  alter_stress:
    name: Alter stress with CAS
    uses: ./.github/workflows/run-alter-stress.yml
    with:
      package: ${{ inputs.package }}
      version: ${{ inputs.version }}
      scenario: all
      storage_provider: minio
      cas_mode: "--cas"
      architecture: ${{ inputs.architecture == 'arm64' && 'ARM' || inputs.architecture }}
      output_format: new-fails
    secrets: inherit

  cas_suites_x86:
    name: Suites with CAS x86
    if: ${{ inputs.architecture == 'x86' || inputs.architecture == 'all' }}
    uses: ./.github/workflows/run-regression.yml
    with:
      package: ${{ inputs.package }}
      version: ${{ inputs.version }}
      arch: x86
      suite: cas_all
      flags: none
    secrets: inherit

  cas_suites_arm:
    name: Suites with CAS arm64
    if: ${{ inputs.architecture == 'arm64' || inputs.architecture == 'all' }}
    uses: ./.github/workflows/run-regression.yml
    with:
      package: ${{ inputs.package }}
      version: ${{ inputs.version }}
      arch: arm64
      suite: cas_all
      flags: none
    secrets: inherit
