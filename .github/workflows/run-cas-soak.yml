name: CAS soak
run-name: CAS soak | ${{ inputs.custom_run_name || format('{0} | {1} | {2}', inputs.version, inputs.suite, inputs.architecture) }}
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package. Either 'docker://' or 'https://'. Example: 'docker://altinity/clickhouse-server:26.6…' or a .deb URL"
        required: true
        type: string
      version:
        description: "Expected ClickHouse version"
        required: true
        type: string
      suite:
        description: "Soak suites to run (default: all)"
        type: choice
        options:
          - all
          - unit
          - unit,phase1
          - phase1
          - phase2
          - phase3
          - scenarios
          - unit,phase1,phase2,phase3
        default: all
      architecture:
        description: "Runner architecture"
        type: choice
        options:
          - x86
          - ARM
          - all
        default: x86
      artifacts:
        description: "Artifact S3 bucket"
        type: choice
        options:
          - internal
        default: internal
      output_format:
        description: "Testflows output style"
        type: choice
        options:
          - classic
          - nice
          - fails
          - new-fails
          - short
          - quiet
          - raw
        default: classic
      ref:
        description: "Commit SHA to checkout. Default: current (empty string)."
        type: string
        default: ""
      extra_args:
        description: "Extra test program arguments (seed, durations, scenario filters, …)."
        type: string
        default: ""
      custom_run_name:
        description: "Custom run name (optional)"
        required: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_REPORT_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_REPORT_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REPORT_REGION }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  CHECKS_DATABASE_HOST: ${{ secrets.CHECKS_DATABASE_HOST }}
  CHECKS_DATABASE_USER: ${{ secrets.CHECKS_DATABASE_USER }}
  CHECKS_DATABASE_PASSWORD: ${{ secrets.CHECKS_DATABASE_PASSWORD }}
  PYTHONIOENCODING: utf-8
  clickhouse_path: ${{ inputs.package }}
  version: ${{ inputs.version }}
  artifacts: ${{ inputs.artifacts }}
  args: --test-to-end
    --no-colors
    --local
    --collect-service-logs
    --output ${{ inputs.output_format }}
    --attr project="${GITHUB_REPOSITORY}" project.id="${GITHUB_REPOSITORY_ID}" user.name="${GITHUB_ACTOR}" version="${{ inputs.version }}" package="${{ inputs.package }}" repository="https://github.com/Altinity/clickhouse-regression" commit.hash="$(git rev-parse HEAD)" job.name=$GITHUB_JOB job.retry=$GITHUB_RUN_ATTEMPT job.url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" arch="$(uname -i)" report.url=$SUITE_REPORT_INDEX_URL
    --log raw.log
    --suite ${{ inputs.suite }}
    ${{ inputs.extra_args }}
  artifact_paths: |
    ./report.html
    ./*.log.txt
    ./*.log
    ./*.html
    ./*/_instances/*.log
    ./*/_instances/*/logs/*.log
    ./*/*/_instances/*/logs/*.log
    ./*/*/_instances/*.log
    ./cas/soak/runs/**
    ./cas/soak/scenarios/runs/**
    ./cas/soak/failure.json
    ./cas/soak/soak.db

jobs:
  cas_soak_x86:
    runs-on: [self-hosted, x86, type-cx53, image-x86-app-docker-ce]
    timeout-minutes: 10000
    env:
      SUITE: cas/soak
      STORAGE: /cas_soak_x86
    if: ${{ contains('all x86', inputs.architecture) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Cache Python dependencies
        uses: ./.github/actions/cache-setup

      - name: Setup
        run: .github/setup.sh

      - name: Install soak Python deps
        run: pip install -r cas/soak/requirements.txt

      - name: Run ${{ env.SUITE }} suite
        run: python3
              -u ${{ env.SUITE }}/regression.py
              --clickhouse-binary-path ${{ env.clickhouse_path }}
              --clickhouse-version ${{ env.version }}
              ${{ env.args }}

      - name: Create and upload logs
        if: always()
        run: .github/create_and_upload_logs.sh ${{ vars.UPLOAD_LOGS }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cas-soak-x86-artifacts
          path: ${{ env.artifact_paths }}

  cas_soak_arm:
    runs-on: [self-hosted, arm64, type-cax31-cax41, image-arm64-app-docker-ce]
    timeout-minutes: 10000
    env:
      SUITE: cas/soak
      STORAGE: /cas_soak_arm
    if: ${{ contains('all ARM', inputs.architecture) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Cache Python dependencies
        uses: ./.github/actions/cache-setup

      - name: Setup
        run: .github/setup.sh

      - name: Install soak Python deps
        run: pip install -r cas/soak/requirements.txt

      - name: Run ${{ env.SUITE }} suite
        run: python3
              -u ${{ env.SUITE }}/regression.py
              --clickhouse-binary-path ${{ env.clickhouse_path }}
              --clickhouse-version ${{ env.version }}
              ${{ env.args }}

      - name: Create and upload logs
        if: always()
        run: .github/create_and_upload_logs.sh ${{ vars.UPLOAD_LOGS }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cas-soak-arm-artifacts
          path: ${{ env.artifact_paths }}
