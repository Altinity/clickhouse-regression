name: 🗓 Scheduled ClickHouse head
run-name: 🗓 Scheduled ClickHouse head
on:
  workflow_dispatch:
  #Run at 00:00 (UTC) on Tuesday and Thursday
  schedule:
    - cron: "0 0 * * 2,4"

# Matrix keeps a single nested expansion of run-regression.yml at parse
# time. Four separate `uses:` jobs exceed GitHub's workflow object size.
jobs:
  clickhouse-head:
    name: clickhouse-head-${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: x86-with-analyzer-zookeeper
            arch: x86
            extra_args: '--with-analyzer'
            run_s3_suites: 'false'
          - id: arm-with-analyzer-zookeeper
            arch: arm64
            extra_args: '--with-analyzer'
            run_s3_suites: 'false'
          - id: x86-with-analyzer-keeper
            arch: x86
            extra_args: '--with-analyzer --use-keeper'
            run_s3_suites: 'true'
          - id: arm-with-analyzer-keeper
            arch: arm64
            extra_args: '--with-analyzer --use-keeper'
            run_s3_suites: 'false'
    uses: ./.github/workflows/run-regression.yml
    with:
      package: "docker://clickhouse/clickhouse-server:head-alpine"
      extra_args: ${{ matrix.extra_args }}
      arch: ${{ matrix.arch }}
      parquet_native_v3: true
      run_s3_suites: ${{ fromJSON(matrix.run_s3_suites) }}
    secrets: inherit
