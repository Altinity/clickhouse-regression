services:
  minio-client:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    init: true
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set minio http://minio1:9001 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do echo 'waiting for RustFS...' && sleep 1; done;
      /usr/bin/mc mb minio/root --ignore-existing;
      touch /tmp/ready;
      exec tail -f /dev/null
      "
    healthcheck:
      test: ["CMD", "ls", "/tmp/ready"]
      interval: 5s
      timeout: 2s
      retries: 60
