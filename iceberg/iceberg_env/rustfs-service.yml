services:
  minio:
    image: rustfs/rustfs:1.0.3
    container_name: iceberg_rustfs
    environment:
      - RUSTFS_ACCESS_KEY=${MINIO_ROOT_USER:-}
      - RUSTFS_SECRET_KEY=${MINIO_ROOT_PASSWORD:-}
      - RUSTFS_RUNTIME_MAX_BLOCKING_THREADS=64
      - RUSTFS_RUNTIME_THREAD_KEEP_ALIVE=5
      - RUSTFS_ALLOCATOR_RECLAIM_ENABLED=true
      - RUSTFS_ALLOCATOR_RECLAIM_INTERVAL_SECS=30
      - RUSTFS_DURABILITY_MODE=relaxed
      - RUSTFS_OBS_LOG_DIRECTORY=
      - RUSTFS_OBS_USE_STDOUT=true
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ENABLE=true
    networks:
      default:
        aliases:
          - warehouse.minio
    ports:
        - 9001:9001
        - 9002:9000
    command: ["/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5