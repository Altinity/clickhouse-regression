server.env=dev
server.authorization=disable
server.iceberg-table.enabled=true

# The Iceberg suite stores all catalog data in its local S3-compatible
# "warehouse" bucket. The Dockerfile patch lets Unity vend these long-lived
# credentials without requiring an AWS STS endpoint.
s3.bucketPath.0=s3://warehouse
s3.region.0=us-east-1
s3.awsRoleArn.0=
s3.endpointUrl.0=http://minio:9000
s3.accessKey.0=admin
s3.secretKey.0=password
s3.sessionToken.0=
