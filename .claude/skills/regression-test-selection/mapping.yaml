  - path: s3
    description: Object-storage disks, the s3 table function, zero-copy replication, and export of MergeTree parts to an S3 table.
    notes:
      - CI runs MinIO in three parts plus export part and export partition, and AWS, Hetzner, Azure, and GCS in two parts each. MinIO, AWS, and Hetzner are S3-compatible. With no storage argument the suite runs MinIO only.
      - Export part and export partition run only on MinIO. Both are skipped unless the build is Antalya and the version is at least 25.8. Skip policy is always skipped (Altinity/ClickHouse 2294 and 2311). Export partition all is skipped before 26.3. Two sanity cases are skipped before 26.1. Duplicate logging on error is skipped (Altinity/ClickHouse 2290).
      - Export partition loads sanity and skip policy only. Error handling, kill, clusters, engines and volumes, datatypes, network, concurrent actions, system monitoring, schema evolution, parallel export, alter during export, replica failover, parallel inserts, lightweight delete, lightweight update, shards, partition key compatibility, settings, and local backoff are not started. Export part does not load filename pattern. IAM auth and EC2 are not started.
      - GCS zero-copy replication is skipped. Azure combinatoric tables are skipped. Azure zero-copy metadata and alter are skipped. Hive partitioning and the remote s3 call are skipped before 24.12, and on a non-Antalya build. The MinIO table-function performance wildcard is skipped.
