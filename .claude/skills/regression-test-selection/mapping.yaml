  - path: aggregate_functions
    description: Aggregate functions.
    notes:
      - nothingNull, nothingUInt64, quantileDD, and quantilesDD have no test module. The suite skips them.
      - denseRank, percent_rank, and percentRank are excluded from part 1 and have no window scenario.
      - --cas reruns the suite for storage.cas. --cas-s3-cache reruns it for storage.disk.cache.
