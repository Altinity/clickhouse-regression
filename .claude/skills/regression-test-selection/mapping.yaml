      - export partition is skipped on non-Antalya builds and on versions before 26.1.
      - export ttl is skipped. TTL EXPORT TO TABLE is not in a released build (Altinity/ClickHouse 2442).
      - nullable minmax pruning is skipped until Altinity/ClickHouse 2657 is in the build.
