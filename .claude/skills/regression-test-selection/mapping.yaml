# Regression suites. One entry per directory that contains regression.py.
# path is the suite CI runs. features lists taxonomy ids and the scenarios that exercise them.
# A feature with no scenarios names a flag. --cas and --cas-s3-cache rerun that suite on CAS storage.
# ci: manual means an automatic selection must not run this suite.

suites:
  - path: .
    description: Top-level runner. It loads other suites and has no scenarios of its own.

  - path: aes_encryption
    description: AES encryption functions. tryDecrypt is not covered.
    notes:
      - The performance feature is skipped when a sanitizer is enabled.
    features:
      - id: functions.encryption.functions_aes
        description: The shared cipher. Run the suite with no --only.
      - id: functions.encryption.encrypt
        scenarios:
          - /aes encryption/encrypt/invalid parameters
          - /aes encryption/encrypt/invalid plaintext data type
          - /aes encryption/encrypt/invalid key or iv length for mode non gcm
          - /aes encryption/encrypt/invalid key or iv length for gcm
          - /aes encryption/encrypt/aad parameter types and length
          - /aes encryption/encrypt/iv parameter types
          - /aes encryption/encrypt/key parameter types
          - /aes encryption/encrypt/mode parameter types
          - /aes encryption/encrypt/encryption
          - /aes encryption/encrypt/return value
          - /aes encryption/encrypt/syntax
          - /aes encryption/compatibility/insert/encrypt using materialized view
          - /aes encryption/compatibility/insert/encrypt using input table function
          - /aes encryption/compatibility/select/decrypt
