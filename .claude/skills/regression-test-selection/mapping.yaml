  - path: integration
    description: Upstream ClickHouse pytest integration tests, launched through tests/integration/runner.
    notes:
      - The suite collects pytest node ids from the ClickHouse tree at runtime. It has no fixed scenario list in this repository.
      - The module function is named regression, so the TestFlows root is /regression. Tests run under /regression/group/{n}/, and the scenario name is the pytest node id.
      - There is no CI job for this suite. A taxonomy id does not select a subset of it.

  - path: json_data_type
    description: JSON columns with varying max_dynamic_paths, max_dynamic_types, depth, and length.
    notes:
      - Every combination is a scenario named combination. There are 480 of them, from the product of the path, type, depth, and length options.
      - There is no CI job for this suite.
    features:
      - id: types.json
        scenarios:
          - /json data type/feature/combinations/*


  - path: jwt_authentication
    description: JWT login with a static key, a static JWKS, and a dynamic JWKS.
    notes:
      - static key, static jwks, and dynamic jwks are skipped. The suite marks them under development.
      - On 26.8 and newer, and on head or latest packages, the suite skips before startup. Legacy jwt_validators config is rejected (ClickHouse 100332). The oauth suite covers token_processors.
      - Not started. static JWKS invalid token, multiple keys, and corrupted token.
    features:
      - id: access.auth.jwt
        scenarios:
          - /jwt authentication/static key/*
          - /jwt authentication/static jwks/*
          - /jwt authentication/dynamic jwks/*
      - id: ddl.on_cluster
        description: The user is created ON CLUSTER and then logs in with a JWT on every node.
        scenarios:
          - /jwt authentication/static key/feature/jwt authentication on cluster
      - id: access.user
        description: Users created with SQL or RBAC, then authenticated with a JWT.
        scenarios:
          - /jwt authentication/static key/static key sanity/check simple jwt authentication with static key rbac user
          - /jwt authentication/static key/static key sanity/jwt authentication after recreating user using rbac


