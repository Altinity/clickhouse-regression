  - path: lightweight_delete
    description: DELETE that writes a row mask, across MergeTree, replicas, views, disks, and backup.
    notes:
      - Skipped before 22.8 unless --force-run. --use-alter-delete runs the same suite as ALTER DELETE.
      - Live view has no taxonomy child.
      - efficient physical data removal is skipped with --cas because part data is not on the local disk.
      - lack of disk space / lightweight delete memory consumption is skipped on 24.3 and newer (ClickHouse issue 63107). lack of disk space tiered storage is skipped because it freezes the server. ontime tests are skipped under sanitizers.
      - --cas and --cas-s3-cache each run four jobs. Two are disk space and hard restart. One skips those plus alter after delete, concurrent alter and delete, concurrent delete, basic checks, performance, and ontime tests. One runs only that skipped group.
    features:
      - id: engines.mergetree.lightweight_delete
        scenarios:
          - /lightweight delete/*
      - id: engines.mergetree.mutations
        description: ALTER mixed with DELETE, and the same suite with --use-alter-delete.
        scenarios:
          - /lightweight delete/acceptance concurrent alter and delete/*
          - /lightweight delete/alter after delete/*
          - /lightweight delete/random concurrent alter/*
          - /lightweight delete/concurrent alter and delete/*
          - /lightweight delete/replicated table with concurrent alter and delete/*
          - /lightweight delete/replicated table with alter after delete on single node/*
      - id: engines.mergetree.ttl
        scenarios:
          - /lightweight delete/acceptance column ttl/*
          - /lightweight delete/delete and column ttl/*
          - /lightweight delete/acceptance tiered storage ttl/*
          - /lightweight delete/delete and tiered storage ttl/*
