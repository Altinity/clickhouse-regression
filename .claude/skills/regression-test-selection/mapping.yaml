          - /dns/ipv6/Test host regexp multiple ptr v4
          - /dns/ipv6/Test host regexp multiple ptr v6


  - path: engines
    description: ReplacingMergeTree with is_deleted, ReplicatedReplacingMergeTree, and SummingMergeTree zero-row deletion.
    notes:
      - replacing_merge_tree and replicated_replacing_merge_tree are skipped before 23.2.
      - Each replacing scenario is loaded as a feature of the same name, so the scenario path repeats that name.
    features:
      - id: engines.mergetree
        scenarios:
          - /engines/replacing_merge_tree/*
          - /engines/replicated_replacing_merge_tree/*
          - /engines/summing_merge_tree/*
      - id: engines.mergetree.replication
        scenarios:
          - /engines/replicated_replacing_merge_tree/*
      - id: coordination.replication
        scenarios:
          - /engines/replicated_replacing_merge_tree/*
      - id: engines.distributed
        scenarios:
          - /engines/replacing_merge_tree/update distributed/update distributed
          - /engines/replicated_replacing_merge_tree/without is deleted distributed/without is deleted distributed
          - /engines/replicated_replacing_merge_tree/with is deleted distributed/with is deleted distributed
          - /engines/replicated_replacing_merge_tree/update distributed/update distributed
      - id: query.distributed
        scenarios:
          - /engines/replacing_merge_tree/update distributed/update distributed
          - /engines/replicated_replacing_merge_tree/without is deleted distributed/without is deleted distributed
          - /engines/replicated_replacing_merge_tree/with is deleted distributed/with is deleted distributed
          - /engines/replicated_replacing_merge_tree/update distributed/update distributed
      - id: engines.mergetree.mutations
        description: ALTER UPDATE that sets a summed column to zero.
        scenarios:
          - /engines/summing_merge_tree/zero row deletion with update
      - id: ddl.update
        scenarios:
          - /engines/summing_merge_tree/zero row deletion with update
      - id: ddl.alter_columns
        description: CLEAR COLUMN IN PARTITION on a summing column.
        scenarios:
          - /engines/summing_merge_tree/zero row deletion with clear column
          - /engines/summing_merge_tree/clear column validation consistency
      - id: storage.cas
        description: The same suite with --cas.
      - id: storage.disk.cache
        description: The same suite with --cas-s3-cache.

