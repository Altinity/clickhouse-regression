  - path: functions
    description: plus on floats, the merge table function, INSERT SELECT with WITH, projection optimization, one-argument math functions, and throwIf.
    notes:
      - merge repeats up to 200 times or until it fails.
      - insert is skipped on 25.4 and newer. A SummingMergeTree summing column cannot also be in the sorting key.
      - projection optimization is skipped before 23.11 (ClickHouse pull 58638).
      - intExp2 and intExp10 on Decimal128(38) are marked not implemented.
    features:
      - id: functions.arithmetic.plus
        description: Float addition with the + operator, including inf and nan. The sketch emits pattern #N combinations.
        scenarios:
          - /functions/plus/floats/*
      - id: types.number
        scenarios:
          - /functions/plus/floats/*
          - /functions/math functions/*
      - id: functions.table.merge
        scenarios:
          - /functions/merge/*
      - id: engines.mergetree
        description: CollapsingMergeTree in merge, ReplicatedMergeTree and ReplicatedSummingMergeTree in insert, and MergeTree in projection optimization.
        scenarios:
          - /functions/merge/*
          - /functions/insert/insert
          - /functions/projection optimization/projection optimization
      - id: engines.distributed
        scenarios:
          - /functions/merge/*
      - id: query.distributed
        scenarios:
          - /functions/merge/*
      - id: engines.mergetree.replication
        scenarios:
          - /functions/insert/insert
      - id: ddl.insert
        description: INSERT SELECT with a WITH alias, compared with the same insert without it.
        scenarios:
          - /functions/insert/insert
      - id: engines.mergetree.projections
        scenarios:
