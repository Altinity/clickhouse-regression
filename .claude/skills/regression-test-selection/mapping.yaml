  - path: settings
    description: Default values of every row in system.settings.
    notes:
      - default values is skipped before 23.3.
    features:
      - id: runtime.settings
        scenarios:
          - /settings/default values/*


  - path: ssl_keeper
    description: TLS to ClickHouse Keeper, including FIPS 140-3 ciphers and the documented secure config.
    notes:
      - No workflow job starts this directory.
      - The suite is skipped before 22.4. fips_ssl is not started.
      - fips 140-3 runs only on a FIPS package, or when --force-fips is passed. doc config inside it is skipped unless the package is a FIPS build.
    features:
      - id: access.tls
        scenarios:
          - /ssl keeper/sanity/*
      - id: access.tls
        description: Only on a FIPS package.
        scenarios:
          - /ssl keeper/fips 140-3/*
      - id: interfaces.keeper
        description: Only on a FIPS package.
        scenarios:
          - /ssl keeper/fips 140-3/*
      - id: coordination.keeper.server
        description: Only on a FIPS package.
        scenarios:
          - /ssl keeper/fips 140-3/*
      - id: coordination.zookeeper
        description: Only on a FIPS package. ClickHouse connects to Keeper through the ZooKeeper client.
        scenarios:
          - /ssl keeper/fips 140-3/*


  - path: ssl_server
    description: Server TLS, including certificate checks, client certificate authentication, verification modes, and FIPS 140-3.
    notes:
      - CI runs three jobs. Part 1 is certificates, sanity, the SSL context, certificate authentication, verification modes, and the url table function. Part 2 is the HTTP dictionary. Part 3 is ZooKeeper, the CA chain, and, on a FIPS package, ZooKeeper FIPS 140-3.
      - fips and zookeeper fips are not started. fips 140-3 and zookeeper fips 140-3 run only when the package is a FIPS build, force_fips is set, or the version string contains fips. Both are skipped from 25.5 (ClickHouse issue 79876). ZooKeeper FIPS is also skipped on aarch64.
      - Verification modes and the CA chain are skipped before 23.3. system.certificates and showCertificate are skipped before 22.8. Dynamic SSL context changes are skipped before 22.3. The suite does not accept a ZooKeeper version argument.
      - The server-as-a-client feature is skipped from 24.3. A non-FIPS clickhouse-client with every protocol disabled is skipped from 24.4. A secure ZooKeeper connection with an empty truststore is skipped on Antalya 25.8 and older.
    features:
      - id: access.tls
        scenarios:
          - /ssl server/part 1/*
          - /ssl server/part 2/dictionary/*
          - /ssl server/part 3/zookeeper/*
          - /ssl server/part 3/ca chain/*
      - id: access.tls
        description: Only on a FIPS package.
        scenarios:
          - /ssl server/part 2/fips 140-3/*
          - /ssl server/part 3/zookeeper fips 140-3/*
      - id: functions.table.url
        scenarios:
          - /ssl server/part 1/url table function/*
      - id: dictionaries.source.http
        scenarios:
          - /ssl server/part 2/dictionary/*
      - id: functions.other.show_certificate
        scenarios:
          - /ssl server/part 1/check certificate/show certificate
      - id: ops.system
        description: system.certificates.
        scenarios:
          - /ssl server/part 1/check certificate/system certificates
      - id: coordination.zookeeper
        scenarios:
          - /ssl server/part 3/zookeeper/*
      - id: coordination.zookeeper
        description: Only on a FIPS package.
        scenarios:
          - /ssl server/part 3/zookeeper fips 140-3/*


  - path: swarms
    description: Swarm reads of Iceberg and object storage through object_storage_cluster, including joins, UNION, discovery, and node failure.
    notes:
      - The suite is skipped unless the build is Antalya. On Antalya it returns before the tests when the object_storage_cluster setting is absent.
      - Task rescheduling is skipped unless the build is Antalya and the version is at least 25.8. Fallback to local if empty is always skipped. The setting is not in an official release yet.
      - Partition pruning, performance, and schema evolution are not started.
      - The profile events feature has no name of its own, so its path is /swarms/feature/feature.
    features:
      - id: query.distributed
        scenarios:
          - /swarms/feature/*
      - id: functions.table.object_storage
        scenarios:
          - /swarms/feature/*
      - id: lakes.iceberg
        scenarios:
          - /swarms/feature/*
      - id: lakes.catalog.rest
        scenarios:
          - /swarms/feature/*
      - id: query.joins
        scenarios:
          - /swarms/feature/swarm joins/*
          - /swarms/feature/swarm join sanity/*
      - id: query.select
        scenarios:
          - /swarms/feature/swarm union/*
      - id: ops.query_log
        description: ObjectStorageCluster profile events in system.query_log.
        scenarios:
          - /swarms/feature/feature/*


  - path: tiered_storage
    description: Storage policies, volumes, and moving MergeTree parts between disks.
    notes:
      - The top-level runner skips this suite unless it is launched on its own. CI runs it as separate jobs. Local uses no storage flag and the feature is named normal. MinIO is --with-minio. AWS is --with-s3amazon. Hetzner is --with-s3hetzner. GCS is --with-s3gcs. CAS is --with-cas.
      - CAS is skipped unless the build is Antalya and the version is at least 26.6.
      - Disk configuration that sets both keep_free_space_bytes and keep_free_space_ratio is not started. Replication with no space is not started. Removing a disk from the config without a restart is not started.
    features:
      - id: storage.policy
        scenarios:
          - /tiered storage/*
      - id: storage.volume
        scenarios:
          - /tiered storage/*/alter move/*
          - /tiered storage/*/background move/*
          - /tiered storage/*/manual move with downtime
          - /tiered storage/*/merge parts different volumes
          - /tiered storage/*/merge parts different volumes no space
          - /tiered storage/*/volume configuration either max_data_part_size_bytes or max_data_part_size_ratio
          - /tiered storage/*/jbod overflow
      - id: storage.disk.object_storage
        scenarios:
          - /tiered storage/with minio/*
          - /tiered storage/with s3amazon/*
          - /tiered storage/with s3hetzner/*
          - /tiered storage/with s3gcs/*
      - id: storage.s3
        scenarios:
          - /tiered storage/with minio/*
          - /tiered storage/with s3amazon/*
          - /tiered storage/with s3hetzner/*
      - id: storage.gcs
        scenarios:
          - /tiered storage/with s3gcs/*
      - id: storage.cas
        scenarios:
          - /tiered storage/with cas/*
      - id: engines.mergetree.ttl
        scenarios:
          - /tiered storage/*/ttl moves/*
      - id: engines.mergetree.replication
        scenarios:
          - /tiered storage/*/simple replication and moves
          - /tiered storage/*/download appropriate disk
          - /tiered storage/*/download appropriate disk advanced
          - /tiered storage/*/download appropriate disk max data part size
          - /tiered storage/*/ttl moves/download appropriate disk*
      - id: engines.mergetree.mutations
        scenarios:
          - /tiered storage/*/mutate to another disk
          - /tiered storage/*/ttl moves/mutation update column in ttl*
          - /tiered storage/*/ttl moves/mutation delete column in ttl*
          - /tiered storage/*/ttl moves/alter delete*
      - id: ddl.partition
        scenarios:
          - /tiered storage/*/attach or replace partition different policies
          - /tiered storage/*/alter move/*
      - id: ddl.rename
        scenarios:
          - /tiered storage/*/rename
      - id: backup.freeze
        scenarios:
          - /tiered storage/*/freeze
      - id: ops.system.disks
        scenarios:
          - /tiered storage/*/system tables
      - id: ops.system.parts
        scenarios:
          - /tiered storage/*/system․detached_parts


