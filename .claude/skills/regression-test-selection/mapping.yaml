  - path: hive_partitioning
    description: Hive partition writes through the S3 table engine on MinIO.
    notes:
      - duckdb writes parquet partitions with DuckDB and reads them back with DuckDB. Those scenarios do not query ClickHouse.
    features:
      - id: engines.object_storage
        description: S3 table engine with partition_strategy hive. HivePartitioningUtils and the partition strategy live here.
