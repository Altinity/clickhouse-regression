  - path: disk_level_encryption
    description: Encrypted disks. A disk of type encrypted wraps another disk and encrypts data at rest.
    notes:
      - memory disk is skipped on 23 and newer. Encrypted memory disks are not supported.
      - wide permission is not implemented.
    features:
      - id: storage.disk.encrypted
        scenarios:
          - /disk level encryption/*
      - id: runtime.io.encryption
        description: The file encryption buffers the encrypted disk uses.
        scenarios:
          - /disk level encryption/*
      - id: storage.policy
        scenarios:
          - /disk level encryption/multi volume policy/*
          - /disk level encryption/operations/alter move multi volume policy/*
      - id: storage.volume
        scenarios:
          - /disk level encryption/multi disk volume/*
          - /disk level encryption/operations/alter move multi disk volume/*
      - id: engines.mergetree.ttl
        scenarios:
          - /disk level encryption/column ttl/*
          - /disk level encryption/multi volume policy/multi volume policy one encrypted disk ttl
          - /disk level encryption/multi volume policy/multi volume policy two encrypted disks in different policies ttl
          - /disk level encryption/multi volume policy/multi volume policy two encrypted disks in one policy ttl
          - /disk level encryption/multi volume policy/multi volume policy three encrypted disks ttl
          - /disk level encryption/multi volume policy/multi volume policy four encrypted disks ttl
      - id: engines.mergetree.replication
        scenarios:
          - /disk level encryption/replicated table/*
      - id: engines.distributed
        scenarios:
          - /disk level encryption/distributed table/*
      - id: query.distributed
        scenarios:
          - /disk level encryption/distributed table/*
      - id: engines.mergetree.compaction
        scenarios:
          - /disk level encryption/merge parts/*
      - id: engines.mergetree
        scenarios:
          - /disk level encryption/wide and compact formats/*
          - /disk level encryption/comparable part sizes/*
      - id: engines.memory
        scenarios:
          - /disk level encryption/memory disk/memory disk
      - id: ddl.insert
        scenarios:
          - /disk level encryption/operations/insert and select/*
      - id: ddl.partition
        scenarios:
          - /disk level encryption/operations/alter move multi disk volume/alter move partition multi disk volume local and encrypted
          - /disk level encryption/operations/alter move multi disk volume/alter move partition multi disk volume encrypted and encrypted
          - /disk level encryption/operations/alter move multi volume policy/alter move partition multi volume policy two volumes one encrypted disk one not in each one key
          - /disk level encryption/operations/alter move multi volume policy/alter move partition multi volume policy two volumes four encrypted disks
          - /disk level encryption/operations/alter move multi volume policy/alter move partition multi volume policy two volumes one encrypted disk
          - /disk level encryption/operations/alter move multi volume policy/alter move partition multi volume policy two volumes three encrypted disks


  - path: dns
    description: DNS resolution between ClickHouse nodes, including host_regexp PTR checks.
    features:
      - id: runtime.dns
        scenarios:
          - /dns/lookup
          - /dns/ipv6/Test host regexp multiple ptr v4 fails with wrong resolution
          - /dns/ipv6/Test host regexp multiple ptr v4
          - /dns/ipv6/Test host regexp multiple ptr v6
