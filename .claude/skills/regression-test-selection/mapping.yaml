          - /aes encryption/compatibility/select/decrypt unique
          - /aes encryption/compatibility/mysql/database engine/encrypt
          - /aes encryption/compatibility/mysql/table engine/encrypt
          - /aes encryption/compatibility/mysql/table function/encrypt
          - /aes encryption/compatibility/mysql/dictionary/parameter values
