# Big features, then medium features.
# Match a changed file to the longest sources prefix in this file.
# Report the big feature and, when a medium feature matches, that medium feature.
# A big feature with no medium entry yet stops at the big feature.

match: longest_source_prefix

features:
  - id: query
    description: Parsing and running a query.
    sources:
      - src/Parsers/
      - src/Analyzer/
      - src/Planner/
      - src/Interpreters/
      - src/Processors/
      - src/QueryPipeline/
    medium:
      - id: query.lexer
        description: Tokens and the parse driver.
        sources:
          - src/Parsers/Lexer.cpp
          - src/Parsers/TokenIterator.cpp
          - src/Parsers/parseQuery.cpp
