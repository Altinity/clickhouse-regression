# Parent features, then child features.
# Match a changed file to the longest sources prefix in this file.
# Report the parent and, when a child matches, that child.
# A match that stops at the parent has no child. There is no level below a child.

match: longest_source_prefix

features:
  - id: query
    description: Parsing and running a query.
    sources:
      - src/Parsers/
      - src/Analyzer/
      - src/Planner/
      - src/Interpreters/
      - src/Processors/
      - src/QueryPipeline/
    children:
      - id: query.lexer
        description: Tokens and the parse driver.
        sources:
          - src/Parsers/Lexer.cpp
          - src/Parsers/TokenIterator.cpp
          - src/Parsers/parseQuery.cpp
          - src/Parsers/IParser.cpp
          - src/Parsers/IParserBase.cpp

      - id: query.expression
        description: Expressions, literals, identifiers, and function calls in the AST.
        sources:
          - src/Parsers/ExpressionElementParsers.cpp
          - src/Parsers/ExpressionListParsers.cpp
          - src/Parsers/ASTFunction.cpp
          - src/Parsers/ASTLiteral.cpp
          - src/Parsers/ASTIdentifier.cpp
          - src/Parsers/IAST.cpp

      - id: query.select
        description: SELECT, UNION, INTERSECT, and EXCEPT.
        sources:
          - src/Parsers/ASTSelectQuery.cpp
          - src/Parsers/ASTSelectWithUnionQuery.cpp
          - src/Parsers/ASTSelectIntersectExceptQuery.cpp
          - src/Parsers/ASTTablesInSelectQuery.cpp
