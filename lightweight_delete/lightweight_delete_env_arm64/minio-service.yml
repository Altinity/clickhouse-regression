version: '2.3'

services:
  # RustFS rather than MinIO: CAS commits objects with conditional writes
  # (If-Match/If-None-Match), which the pinned MinIO release does not support.
  minio:
    image: rustfs/rustfs:1.0.0-beta.12
    container_name: lightweight_delete_rustfs
    ports:
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=minio
      - RUSTFS_SECRET_KEY=minio123
      - RUSTFS_SCANNER_ENABLED=false
      - RUSTFS_HEAL_ENABLED=false
      - RUSTFS_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=false
    command: ["/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:9001/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
