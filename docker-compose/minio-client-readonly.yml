services:
  minio-client-readonly:
    image: clickhouse/minio-mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: >
     /bin/sh -c "
     /usr/bin/mc config host add minio http://minio_readonly:9002 minio minio123;
     /usr/bin/mc mb minio/root;
     touch /tmp/ready;
     "
    healthcheck:
      test: ["CMD", "ls", "/tmp/ready"]
      interval: 5s
      timeout: 2s
      retries: 60
