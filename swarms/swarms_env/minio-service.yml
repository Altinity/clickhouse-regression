services:
  minio:
    image: clickhouse/minio-minio:RELEASE.2026-08-04T00-00-00Z
    container_name: swarms_minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-}
      - MINIO_DOMAIN=minio
    networks:
      default:
        aliases:
          - warehouse.minio
    ports:
        - 9001:9001
        - 9002:9000
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9001/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5