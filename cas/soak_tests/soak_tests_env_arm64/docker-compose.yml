services:
  minio:
    extends:
      file: rustfs-service.yml
      service: minio
  mc:
    extends:
      file: minio-client.yml
      service: mc
    depends_on:
      minio:
        condition: service_healthy


  s3proxy:
    image: python:3.12-slim
    command: ["python3", "/app/s3_fault_proxy.py"]
    environment:
      RUSTFS_UPSTREAM: "minio:9000"
      S3_PROXY_PORT: "9000"
      S3_PROXY_CTL_PORT: "8474"
    volumes:
      - "${CLICKHOUSE_TESTS_DIR}/proxy:/app:ro"
    ports:
      - "8474:8474"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8474/healthz', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  zookeeper1:
    extends:
      file: ../../../docker-compose/zookeeper-service.yml
      service: zookeeper-alone

  clickhouse1:
    extends:
      file: clickhouse-service.yml
      service: clickhouse
    hostname: clickhouse1
    ports:
      - "8123:8123"
    volumes:
      - "${CLICKHOUSE_TESTS_DIR}/configs/clickhouse1/config.d/macros.xml:/etc/clickhouse-server/config.d/macros.xml"
      - "${CLICKHOUSE_TESTS_DIR}/configs/fsck_only_ca_regression.xml:/etc/clickhouse-server/fsck-only.xml:ro"
      - "${CLICKHOUSE_TESTS_DIR}/_instances/clickhouse1/database/:/var/lib/clickhouse/"
      - "${CLICKHOUSE_TESTS_DIR}/_instances/clickhouse1/logs/:/var/log/clickhouse-server/"
    depends_on:
      minio:
        condition: service_healthy
      mc:
        condition: service_healthy
      zookeeper1:
        condition: service_healthy
      s3proxy:
        condition: service_healthy

  clickhouse2:
